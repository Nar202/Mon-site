<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Nom de la Boutique</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: Arial;
    }
    /* EN-TÊTE */
    header {
      background: blue;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }
    header h1 {
      font-size: 28px;
    }
    header p {
      margin-top: 10px;
    }
    
    /* SECTION PRODUITS */
    .produits {
      padding: 30px 20px;
      background: #f2f2f2;
    }
    .produits h2 {
      text-align: center;
      margin-bottom: 20px;
      color: blue;
    }
    .carte {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .carte img {
      width: 60%;
      border-radius: 8px;
    }
    .carte h3 {
      margin: 10px 0;
    }
    .prix {
      color: red;
      font-weight:bold;
      font-size: 18px;
    }
    
    /* BOUTON WHATSAPP */
    .btn-whatsapp {
      display: block;
      width: 80%;
      margin: 20px auto;
      text-align: center;
      background: #25D366;
      color: white;
      padding: 10px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }
    
    /* PIED DE PAGE */
    footer {
      background: #220;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 50px;
    }
  </style>
</head>
<body>

  <!-- 1. EN-TÊTE -->
  <header>
    <h1>Ma Boutique en Ligne</h1>
    <p>Livraison partout au Bénin 🇧🇯</p>
  </header>

  <!-- 2. PRODUITS -->
  <section class="produits">
    <h2>Nos Produits</h2>
    
    <div class="carte">
      <img src="/images /ordi.jpg" alt="Produit 1">
      <h3>Ordinateur portatif</h3>
      <p>Venu de France </p><p> Toutes marques.</p>
      <p class="prix">90000 FCFA</p>
    </div>
    
    <div class="carte">
      <img src="/images /1759593001746.jpg" alt="Produit 2">
      <h3>Chaussure Sport</h3>
      <p>Confortable pour le sport et la ville.</p>
      <p class="prix">15000 FCFA</p>
    </div>

  </section>

  <!-- 3. BOUTON CONTACT -->
  <a href="https://wa.me/22969574589"class="btn-whatsapp" target="_blanc">
    Commander sur WhatsApp
  </a>

  <!-- 4. PIED DE PAGE -->
  <footer>
    <p>© 2026 Ma Boutique. Contact: 01 69 57 45 89</p>
  </footer>

</body>
</html>
